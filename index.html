<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d19"><link rel="manifest" href="manifest.webmanifest"><title>Academic Command Center</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d19;color:#f5f7fb;font:14px Inter,system-ui,sans-serif}button,input,select{font:inherit}.app{min-height:100vh;display:flex}.side{position:fixed;width:230px;inset:0 auto 0 0;background:#0b1220;border-right:1px solid #253149;padding:22px 14px}.brand{font:700 21px Georgia;margin:4px 10px 28px}.brand b{color:#ef3d5a}.side button,.mobile button{display:block;width:100%;border:0;background:transparent;color:#8e9bb0;text-align:left;padding:12px;border-radius:11px;margin:3px 0}.side button.active,.mobile button.active{background:#141e30;color:#fff}.main{margin-left:230px;padding:28px;max-width:1450px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.ey{color:#8e9bb0;font-size:12px}.title{font:700 31px Georgia;margin:5px 0}.grid{display:grid;gap:15px}.four{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.3fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:#101827;border:1px solid #253149;border-radius:17px;padding:18px}.label{font-size:11px;color:#8e9bb0}.big{font-size:27px;font-weight:700;margin:7px 0}.muted{color:#8e9bb0}.bar{height:8px;background:#202c40;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#ef3d5a}.btn{border:1px solid #253149;background:#141e30;color:#fff;padding:9px 13px;border-radius:10px}.primary{background:#ef3d5a;border-color:#ef3d5a}.task{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #253149;border-radius:12px;margin:8px 0;background:#0e1625}.task.done{opacity:.5}.task.done span{text-decoration:line-through}.tag{font-size:11px;color:#8e9bb0}.tabs{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}.tab{padding:8px 11px;border:1px solid #253149;border-radius:9px;background:transparent;color:#8e9bb0}.tab.on{background:#19253a;color:#fff}.subject{padding:16px;border:1px solid #253149;border-radius:15px;background:#101827}.subject h3{margin:0 0 5px}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:18px;z-index:9}.modal.show{display:grid}.box{background:#101827;border:1px solid #253149;border-radius:18px;padding:20px;width:min(500px,100%)}form{display:grid;gap:10px}input,select,textarea{background:#0c1422;color:#fff;border:1px solid #253149;border-radius:9px;padding:10px}.mobile{display:none}.section{display:none}.section.on{display:block}.empty{text-align:center;padding:35px;color:#8e9bb0}.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}.heat i{aspect-ratio:1;background:#1a2638;border-radius:3px}.heat i.on{background:#ef3d5a}@media(max-width:850px){.side{display:none}.main{margin:0;padding:20px 14px 85px}.four{grid-template-columns:1fr 1fr}.two,.three{grid-template-columns:1fr}.mobile{position:fixed;display:flex;bottom:0;left:0;right:0;background:#0b1220;border-top:1px solid #253149;z-index:8}.mobile button{margin:0;border-radius:0;text-align:center;font-size:11px}.title{font-size:26px}}@media(max-width:500px){.four{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Academic <b>Command</b></div><div id="sideNav"></div></aside><main class="main"><section id="home" class="section on"></section><section id="academics" class="section"></section><section id="tasks" class="section"></section><section id="progress" class="section"></section><section id="settings" class="section"></section><section id="cat" class="section"></section><section id="ba" class="section"></section><section id="goals" class="section"></section><section id="calendar" class="section"></section><section id="news" class="section"></section></main></div><nav class="mobile" id="mobileNav"></nav>
<div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Add task</h2><form id="form"><input id="eid" type="hidden"><input id="tn" placeholder="Task name" required><select id="tc"><option>College</option><option>CAT Prep</option><option>Business Analytics</option><option>Career</option><option>Personal</option></select><select id="tp"><option>High</option><option selected>Medium</option><option>Low</option></select><input id="td" type="date" required><input id="tt" type="time"><textarea id="tx" placeholder="Notes"></textarea><div><button type="button" class="btn" onclick="closeM()">Cancel</button> <button class="btn primary">Save</button></div></form></div></div>
<script>
const K='acc_pwa_v4';const DEF={name:'',tasks:[],subjects:[],cat:{overall:0,mocks:0,accuracy:0,topics:[]},ba:0,baTopics:[],goals:[],streak:0,lastActive:''};let s;try{s=JSON.parse(localStorage.getItem(K)||'null')}catch(e){s=null}if(!s||typeof s!=='object')s={};s={...DEF,...s,cat:{...DEF.cat,...(s.cat||{}),topics:Array.isArray(s.cat&&s.cat.topics)?s.cat.topics:[]},tasks:Array.isArray(s.tasks)?s.tasks:[],subjects:Array.isArray(s.subjects)?s.subjects:[],baTopics:Array.isArray(s.baTopics)?s.baTopics:[],goals:Array.isArray(s.goals)?s.goals:[]};const nav=[['home','Home','⌂'],['academics','Academics','▦'],['tasks','Tasks','✓'],['progress','Progress','◒'],['settings','Settings','⚙']];
function save(){localStorage.setItem(K,JSON.stringify(s))}function today(){return new Date().toISOString().slice(0,10)}function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('active',x.dataset.n===id));render(id)}
function navUI(){let x=nav.map(n=>'<button data-n="'+n[0]+'" onclick="go(\''+n[0]+'\')">'+n[2]+' '+n[1]+'</button>').join('');sideNav.innerHTML=x;mobileNav.innerHTML=nav.map(n=>'<button data-n="'+n[0]+'" onclick="go(\''+n[0]+'\')">'+n[2]+'<br>'+n[1]+'</button>').join('')}
function head(e,t,extra=''){return '<div class="top"><div><div class="ey">'+e+'</div><h1 class="title">'+t+'</h1><div class="muted">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</div></div>'+extra+'</div>'}
function pct(a,b){return b?Math.round(a/b*100):0}function task(t){return '<div class="task '+(t.done?'done':'')+'"><div><label><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggle('+t.id+')"> <span>'+esc(t.name)+'</span></label><div class="tag">'+t.cat+' · '+t.priority+(t.time?' · '+t.time:'')+'</div></div><div><button class="btn" type="button" onclick="editTask('+t.id+')">Edit</button> <button class="btn" type="button" onclick="deleteTask('+t.id+')">Delete</button></div></div>'}function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderHome(){let ts=s.tasks.filter(t=>t.date===today()),done=ts.filter(t=>t.done).length,cp=s.subjects.length?Math.round(s.subjects.reduce((a,x)=>a+x.progress,0)/s.subjects.length):0;home.innerHTML=head('PERSONAL ACADEMIC COMMAND CENTER','Good morning'+(s.name?', '+esc(s.name):'')+'!','<button class="btn primary" onclick="openM()">+ Add task</button>')+'<div class="grid four"><div class="card"><div class="label">TODAY</div><div class="big">'+pct(done,ts.length)+'%</div><div class="muted">'+done+' of '+ts.length+' done</div></div><div class="card"><div class="label">STREAK</div><div class="big">'+s.streak+' days</div><div class="muted">Complete one planned task</div></div><div class="card"><div class="label">CAT</div><div class="big">'+s.cat.overall+'%</div><div class="muted">'+s.cat.mocks+' mocks</div></div><div class="card"><div class="label">BUSINESS ANALYTICS</div><div class="big">'+s.ba+'%</div><div class="muted">Learning progress</div></div></div><div style="height:15px"></div><div class="grid two"><div class="card"><h3>Today\'s tasks</h3>'+(ts.map(task).join('')||'<div class="empty">Nothing planned for today.</div>')+'</div><div class="card"><h3>Study overview</h3><p>College · '+cp+'%</p><div class="bar"><i style="width:'+cp+'%"></i></div><p>CAT Prep · '+s.cat.overall+'%</p><div class="bar"><i style="width:'+s.cat.overall+'%"></i></div><p>BA Learning · '+s.ba+'%</p><div class="bar"><i style="width:'+s.ba+'%"></i></div></div></div>'}
function renderAcademics(){let cp=s.subjects.length?Math.round(s.subjects.reduce((a,x)=>a+x.progress,0)/s.subjects.length):0;academics.innerHTML=head('ACADEMICS','College Hub','<button class="btn primary" onclick="addSubject()">+ Add subject</button>')+'<div class="card"><b>College study progress · '+cp+'%</b><div class="bar" style="margin-top:10px"><i style="width:'+cp+'%"></i></div></div><div style="height:15px"></div><div class="grid three">'+(s.subjects.length?s.subjects.map(x=>'<div class="subject"><h3>'+esc(x.name)+'</h3><div class="muted">'+x.units+' units · '+x.materials.length+' materials</div><p>'+x.progress+'%</p><div class="bar"><i style="width:'+x.progress+'%"></i></div></div>').join(''):'<div class="card empty">No subjects added yet. Add your first subject to start tracking college progress.</div>')+'</div>'}
function renderTasks(){let ts=s.tasks.filter(t=>t.date===today()),d=ts.filter(t=>t.done).length;tasks.innerHTML=head('PRODUCTIVITY','Daily Tasks','<button class="btn primary" onclick="openM()">+ Add task</button>')+'<div class="card"><h3>Daily Progress · '+pct(d,ts.length)+'%</h3><div class="bar"><i style="width:'+pct(d,ts.length)+'%"></i></div></div><div style="height:15px"></div><div class="card">'+(ts.map(task).join('')||'<div class="empty">No tasks planned today.</div>')+'</div>'}
function renderProgress(){let done=s.tasks.filter(x=>x.done).length;progress.innerHTML=head('ANALYTICS','Growth Metrics')+'<div class="grid four"><div class="card"><div class="label">TASK COMPLETION</div><div class="big">'+pct(done,s.tasks.length)+'%</div></div><div class="card"><div class="label">CAT</div><div class="big">'+s.cat.overall+'%</div></div><div class="card"><div class="label">STREAK</div><div class="big">'+s.streak+' days</div></div><div class="card"><div class="label">BA</div><div class="big">'+s.ba+'%</div></div></div><div style="height:15px"></div><div class="card"><h3>Last 30 Days</h3><div class="heat">'+Array.from({length:30},(_,i)=>'<i class="'+(i<Math.min(s.streak,30)?'on':'')+'"></i>').join('')+'</div></div>'}
function renderSettings(){settings.innerHTML=head('PREFERENCES','Settings')+'<div class="card"><h3>Profile</h3><label>Name<input value="'+esc(s.name)+'" onchange="s.name=this.value;save();renderHome()"></label><p><button class="btn" onclick="if(confirm(\'Clear all app data?\')){localStorage.removeItem(K);location.reload()}">Clear saved data</button></p></div>'}
function render(id){({home:renderHome,academics:renderAcademics,tasks:renderTasks,progress:renderProgress,settings:renderSettings,cat:renderCat,ba:renderBA,goals:renderGoals,calendar:renderCalendar,news:renderNews}[id]||renderHome)()}function toggle(id){let t=s.tasks.find(x=>x.id===id);if(!t)return;let was=t.done;t.done=!t.done;if(!was&&t.done){if(s.lastActive!==today()){s.streak++;s.lastActive=today()}}save();renderTasks();renderHome()}
function openM(){form.reset();eid.value='';modalTitle.textContent='Add task';modal.classList.add('show');td.value=today()}function editTask(id){let t=s.tasks.find(x=>x.id===id);if(!t)return;eid.value=t.id;tn.value=t.name;tc.value=t.cat;tp.value=t.priority;td.value=t.date;tt.value=t.time||'';tx.value=t.notes||'';modalTitle.textContent='Edit task';modal.classList.add('show')}function deleteTask(id){let t=s.tasks.find(x=>x.id===id);if(!t)return;if(confirm('Delete this task?')){s.tasks=s.tasks.filter(x=>x.id!==id);save();renderTasks();renderHome();renderProgress()}}function closeM(){modal.classList.remove('show');form.reset();eid.value='';modalTitle.textContent='Add task'}form.onsubmit=e=>{e.preventDefault();if(eid.value){let t=s.tasks.find(x=>x.id===Number(eid.value));if(t){t.name=tn.value;t.cat=tc.value;t.priority=tp.value;t.date=td.value;t.time=tt.value;t.notes=tx.value}}else{s.tasks.push({id:Date.now(),name:tn.value,cat:tc.value,priority:tp.value,date:td.value,time:tt.value,notes:tx.value,done:false})}save();closeM();renderTasks();renderHome();renderProgress()}
function addSubject(){let n=prompt('Subject name');if(!n)return;let u=parseInt(prompt('Number of units','5'),10)||5;s.subjects.push({name:n,units:u,progress:0,materials:[]});save();renderAcademics();renderHome()}
navUI();go('home');

function renderCat(){let topics=s.cat.topics;cat.innerHTML=head('ENTRANCE EXAM','CAT Preparation','<button class="btn primary" onclick="addCatTopic()">+ Add topic</button>')+'<div class="grid three"><div class="card"><div class="label">OVERALL</div><div class="big">'+s.cat.overall+'%</div></div><div class="card"><div class="label">MOCKS</div><div class="big">'+s.cat.mocks+'</div></div><div class="card"><div class="label">ACCURACY</div><div class="big">'+s.cat.accuracy+'%</div></div></div><div style="height:15px"></div><div class="card"><h3>Syllabus / Topics</h3>'+(topics.length?topics.map((x,i)=>'<div class="task"><span>'+esc(x.name)+'</span><select onchange="updateCatTopic('+i+',this.value)"><option '+(x.status==='Not Started'?'selected':'')+'>Not Started</option><option '+(x.status==='Learning'?'selected':'')+'>Learning</option><option '+(x.status==='Practicing'?'selected':'')+'>Practicing</option><option '+(x.status==='Completed'?'selected':'')+'>Completed</option></select></div>').join(''):'<div class="empty">Add your CAT topics to start tracking.</div>')+'</div><div style="height:15px"></div><div class="card"><h3>Mock Tracker</h3><p class="muted">Mocks taken: '+s.cat.mocks+' · Accuracy: '+s.cat.accuracy+'%</p><button class="btn" onclick="addMock()">Record mock</button></div>'}
function addCatTopic(){let n=prompt('CAT topic name');if(!n)return;s.cat.topics.push({name:n,status:'Not Started'});recalcCat();save();renderCat();renderHome()}
function updateCatTopic(i,v){s.cat.topics[i].status=v;recalcCat();save();renderCat();renderHome();renderProgress()}
function recalcCat(){let t=s.cat.topics;if(t.length)s.cat.overall=Math.round(t.filter(x=>x.status==='Completed').length/t.length*100)}
function addMock(){s.cat.mocks++;let a=prompt('Accuracy for this mock (%)','');if(a!==null&&!isNaN(Number(a))){let old=s.cat.accuracy*(s.cat.mocks-1);s.cat.accuracy=Math.round((old+Number(a))/s.cat.mocks)}save();renderCat();renderHome()}
function renderBA(){let t=s.baTopics;ba.innerHTML=head('LEARNING','Business Analytics','<button class="btn primary" onclick="addBATopic()">+ Add topic</button>')+'<div class="card"><div class="label">OVERALL LEARNING</div><div class="big">'+s.ba+'%</div><div class="bar"><i style="width:'+s.ba+'%"></i></div><p class="muted">Track Excel, Statistics, SQL, Power BI, Python, Business Analytics Concepts and Case Studies.</p></div><div style="height:15px"></div><div class="card"><h3>Skills & Topics</h3>'+(t.length?t.map((x,i)=>'<div class="task"><span>'+esc(x.name)+'</span><select onchange="updateBATopic('+i+',this.value)"><option '+(x.status==='Not Started'?'selected':'')+'>Not Started</option><option '+(x.status==='Learning'?'selected':'')+'>Learning</option><option '+(x.status==='Practicing'?'selected':'')+'>Practicing</option><option '+(x.status==='Completed'?'selected':'')+'>Completed</option></select></div>').join(''):'<div class="empty">Add your first Business Analytics topic.</div>')+'</div>'}
function addBATopic(){let n=prompt('Business Analytics topic (e.g. Excel: SUMIFS)');if(!n)return;s.baTopics.push({name:n,status:'Not Started'});recalcBA();save();renderBA();renderHome()}
function updateBATopic(i,v){s.baTopics[i].status=v;recalcBA();save();renderBA();renderHome();renderProgress()}
function recalcBA(){s.ba=s.baTopics.length?Math.round(s.baTopics.filter(x=>x.status==='Completed').length/s.baTopics.length*100):0}
function renderGoals(){goals.innerHTML=head('OBJECTIVES','Goals','<button class="btn primary" onclick="addGoal()">+ Add goal</button>')+'<div class="card">'+(s.goals.length?s.goals.map((g,i)=>'<div class="task"><span><b>'+esc(g.name)+'</b><br><small class="tag">'+esc(g.deadline||'No deadline')+'</small></span><button class="btn" onclick="deleteGoal('+i+')">Delete</button></div>').join(''):'<div class="empty">No goals yet.</div>')+'</div>'}
function addGoal(){let n=prompt('Goal name');if(!n)return;let d=prompt('Deadline (optional, YYYY-MM-DD)','');s.goals.push({name:n,deadline:d||''});save();renderGoals()}
function deleteGoal(i){if(confirm('Delete this goal?')){s.goals.splice(i,1);save();renderGoals()}}
function renderCalendar(){let ts=[...s.tasks].sort((a,b)=>a.date.localeCompare(b.date));calendar.innerHTML=head('PLANNING','Calendar')+'<div class="card"><h3>Upcoming</h3>'+(ts.length?ts.map(t=>'<div class="task"><span>'+esc(t.name)+'</span><span class="tag">'+t.date+(t.time?' · '+t.time:'')+'</span></div>').join(''):'<div class="empty">No scheduled tasks.</div>')+'</div>'}
function renderNews(){news.innerHTML=head('BRIEFING','News')+'<div class="card"><h3>Current News</h3><p class="muted">This section is ready for live news integration. No headlines are being invented or stored as fake current news.</p><button class="btn primary" onclick="window.open('https://news.google.com/','_blank')">Open live news</button></div>'}
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
